name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Translation drift never breaks the build and never shows an error — a
      # German user just silently sees English. Nothing else would catch it.
      - run: pnpm i18n:check

      # Ingress is the one part of the app with no type safety: the path prefix
      # is a runtime string from a header, and every failure mode looks like
      # "the page renders but navigation does nothing". Runs against the build
      # above rather than `pnpm ingress:check`, which would build a second time.
      - name: Check Home Assistant Ingress path handling
        run: node scripts/check-ingress.mjs

      # The add-on manifest is only correct if it stays in step with the code,
      # and a mismatch here is invisible until an install fails.
      - name: Check add-on manifest
        run: |
          version=$(grep -E '^version:' gardena-scheduler/config.yaml | sed 's/version:[[:space:]]*//' | tr -d '"')
          test -n "$version" || { echo "gardena-scheduler/config.yaml has no version"; exit 1; }
          test -f repository.yaml || { echo "repository.yaml missing"; exit 1; }
          for f in icon.png logo.png DOCS.md CHANGELOG.md; do
            test -f "gardena-scheduler/$f" || { echo "gardena-scheduler/$f missing"; exit 1; }
          done
          echo "add-on version $version"

      # Home Assistant renders the Configuration tab from these files. A key that
      # does not match the schema shows the raw option name instead of a label,
      # and only ever in the language nobody on the project is reading.
      - name: Check add-on option translations
        run: |
          # Don't assume the runner image ships PyYAML — a missing import here
          # would look like a translation failure rather than a setup one.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

          python3 - <<'PY'
          import sys, glob, os
          import yaml

          schema = set(yaml.safe_load(open("gardena-scheduler/config.yaml"))["schema"])
          failed = False

          for path in sorted(glob.glob("gardena-scheduler/translations/*.yaml")):
              data = yaml.safe_load(open(path)) or {}
              keys = set((data.get("configuration") or {}).keys())
              lang = os.path.basename(path)

              for key in sorted(schema - keys):
                  print(f"{lang}: missing translation for option '{key}'")
                  failed = True
              for key in sorted(keys - schema):
                  print(f"{lang}: translates '{key}', which is not in the schema")
                  failed = True

              if not (schema - keys) and not (keys - schema):
                  print(f"{lang}: all {len(schema)} options translated")

          sys.exit(1 if failed else 0)
          PY

      # Migrations ship in the image and run at boot; a schema change without a
      # generated migration would fail on someone else's data, not ours.
      - name: Check migrations are up to date
        run: |
          pnpm exec drizzle-kit generate
          # `git status --porcelain`, not `git diff`: a freshly generated
          # migration is an *untracked* file, which git diff does not report.
          drift=$(git status --porcelain -- drizzle)
          if [ -n "$drift" ]; then
            echo "Schema changed without a committed migration. Run: pnpm db:generate"
            echo "$drift"
            exit 1
          fi
