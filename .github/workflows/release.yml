name: Release add-on

# Publishes the images that gardena-scheduler/config.yaml points at. Home Assistant appends
# `:{version}` to the image name, so the tag published here has to match the
# `version:` field in that file exactly — the job below reads it from there
# rather than trusting the git tag, so the two cannot drift apart.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    # Each architecture builds on its own native runner. Building arm64 on an
    # amd64 runner means QEMU, and emulating V8 crashes with
    # "qemu: uncaught target signal 4 (Illegal instruction)" partway through the
    # Node build. arm64 runners are free on public repositories.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        run: |
          version=$(grep -E '^version:' gardena-scheduler/config.yaml | sed 's/version:[[:space:]]*//' | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version for ${{ matrix.arch }}"

      # No setup-qemu-action: each runner builds its own architecture natively.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # BUILD_VERSION busts the source layer cache and is surfaced on the
          # app's Settings page, so a stale deploy is visible rather than
          # something you have to infer from behaviour.
          build-args: |
            BUILD_VERSION=${{ steps.addon.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gardena-schedule-${{ matrix.arch }}:${{ steps.addon.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/gardena-schedule-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
