# Home Assistant add-on manifest.
#
# Installed by adding this repository under Settings → Add-ons → Add-on Store →
# ⋮ → Repositories. Supervisor pulls the prebuilt image named below rather than
# building on the device, so installing on a Raspberry-Pi-class box is a download
# instead of a multi-minute build.
name: Gardena Scheduler
version: "1.6.2"
slug: gardena_scheduler
description: Scheduling for a GARDENA smart irrigation system
url: https://github.com/frontendphil/gardena-schedule

# Home Assistant Green is aarch64; amd64 covers an Intel NUC or a VM.
arch:
  - aarch64
  - amd64

# Published by .github/workflows/release.yml. Supervisor substitutes {arch} and
# appends `:{version}`, so the tag must match `version` above.
image: ghcr.io/frontendphil/gardena-schedule-{arch}

# The image is not based on a Home Assistant base image, so Supervisor's s6 init
# would have nothing to do.
init: false
startup: application
boot: auto

# Served through Home Assistant Ingress: the panel appears in the sidebar and
# Home Assistant does the authenticating, so the add-on needs no login of its
# own and no port has to be opened on the network.
ingress: true
ingress_port: 3000
panel_icon: mdi:sprinkler-variant
panel_title: Watering

# Declared but unmapped: direct LAN access is opt-in from the add-on's
# Network settings. Anything reaching this port bypasses Home Assistant's
# authentication entirely.
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Direct access, bypassing Home Assistant login. Leave unset unless you need it.

# The scheduler has to survive a Home Assistant restart without a browser open.
watchdog: "tcp://[HOST]:[PORT:3000]"

options:
  gardena_application_key: ""
  gardena_application_secret: ""
schema:
  gardena_application_key: str
  gardena_application_secret: password
